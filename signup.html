<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <script src="signup.js" defer></script>
</head>
<body>
    <main class="signup-card">
        <h1>Create Account</h1>
        <p class="subtitle">Enter your information to sign up</p>

        <form id="signupForm" novalidate>
            <div class="input-group">
                <label for="username">User Name</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <button type="button" class="show-password" data-target="password">
                        Show
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repeat your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <button type="button" class="show-password" data-target="confirmPassword">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="signup-button">Sign Up</button>
            <p id="result" aria-live="polite"></p>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="website.html" class="page-link">Login</a>
        </p>
    </main>
</body>
</html>
